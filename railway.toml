# Railway config-as-code for OpenNOW Web (optional — defaults also work)
# Commit this file to the root of your fork.

[build]
builder = "NIXPACKS"
# Nixpacks auto-runs: npm ci (package-lock.json present) -> npm run build (exists)

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
